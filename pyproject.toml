[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trader"
version = "0.1.0"
description = "AI-powered perpetual futures trading agent system using DDD architecture"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Trader Team"}
]
packages = [{include = "trader", from = "src"}]

dependencies = [
    "pydantic>=2.0",
    "ccxt>=4.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "ta>=0.11.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ""

[tool.coverage.run]
source = ["src/trader"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[[tool.uv.index]]
url = "https://mirrors.huaweicloud.com/artifactory/pypi-public/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
